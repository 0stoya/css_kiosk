# CSS Kiosk production reverse proxy.
# Next.js listens only on 127.0.0.1:3099 via ecosystem.config.cjs.

server {
    listen 80;
    listen [::]:80;

    server_name kiosk.csscdn.co.uk;

    access_log /var/log/nginx/css-kiosk-access.log;
    error_log /var/log/nginx/css-kiosk-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/css-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name kiosk.csscdn.co.uk;

    ssl_certificate /etc/letsencrypt/live/kiosk.csscdn.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kiosk.csscdn.co.uk/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    access_log /var/log/nginx/css-kiosk-access.log;
    error_log /var/log/nginx/css-kiosk-error.log;

    location / {
        proxy_pass http://127.0.0.1:3099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_buffering off;
        proxy_read_timeout 86400;
    }
}
